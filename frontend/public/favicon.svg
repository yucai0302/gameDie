<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15151C"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D2E"/>
      <stop offset="100%" stop-color="#CC3D24"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B8CC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <g transform="translate(32 32)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>

    <line x1="-22" y1="0" x2="-16" y2="0" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="16" y1="0" x2="22" y2="0" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="0" y1="-22" x2="0" y2="-16" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="0" y1="16" x2="0" y2="22" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>

    <path d="M0 -11 C-4 -11 -8 -7 -8 -2 C-8 4 -4 9 0 11 C4 9 8 4 8 -2 C8 -7 4 -11 0 -11 Z"
          fill="url(#flameGrad)" filter="url(#glowStrong)"/>

    <ellipse cx="-3" cy="-4" rx="2" ry="2.5" fill="#0A0A0F"/>
    <ellipse cx="3" cy="-4" rx="2" ry="2.5" fill="#0A0A0F"/>

    <path d="M-3 3 L-3 5 M0 3 L0 5 M3 3 L3 5" stroke="#0A0A0F" stroke-width="1" stroke-linecap="round"/>

    <circle cx="0" cy="0" r="2" fill="#00E5FF" filter="url(#glowStrong)"/>
  </g>
</svg>
